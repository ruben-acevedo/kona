# Once a week, checks whether castLabs published a newer Electron (with Widevine) than the one
# in scripts/electron-win.js. If so, opens an issue (GitHub emails the owner). Nothing is built
# or published here: the update itself is npm run update-electron → test:windows → release.
name: Electron update check

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the latest castLabs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(grep -oP "const TAG = '\Kv[^']+" scripts/electron-win.js)
          cur_major=$(echo "$current" | sed -E 's/^v([0-9]+)\..*/\1/')

          # stable castLabs releases, newest version first
          gh api 'repos/castlabs/electron-releases/releases?per_page=60' \
            --jq '.[] | select(.prerelease | not) | select(.draft | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\+wvcus$' \
            | sort -rV > tags.txt

          latest=$(head -n1 tags.txt)
          latest_same=$(grep -E "^v${cur_major}\." tags.txt | head -n1 || true)
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -rV | head -n1)

          echo "current=$current latest=$latest latest_same_major=$latest_same"
          if [ "$newest" = "$current" ]; then
            echo "Up to date."
            exit 0
          fi

          title="Electron update available: ${latest#v}"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
            echo "Issue already open."
            exit 0
          fi

          {
            echo "castLabs published a newer Electron than the one Kona uses."
            echo
            echo "- Current: \`${current#v}\`"
            [ -n "$latest_same" ] && [ "$latest_same" != "$current" ] && echo "- Latest in the same major (safer): \`${latest_same#v}\` → \`npm run update-electron\`"
            [ "$latest" != "$latest_same" ] && echo "- Latest overall (new major): \`${latest#v}\` → \`npm run update-electron -- --major\`"
            echo
            echo "Then: \`npm run test:windows\` (full suite) and, if it passes, \`npm run release\`."
            echo
            echo "Release notes: https://github.com/castlabs/electron-releases/releases/tag/${latest/+/%2B}"
          } > body.md

          gh issue create --title "$title" --body-file body.md
